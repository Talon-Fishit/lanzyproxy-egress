  alztrk-warp-f:
    <<: *warp
    container_name: ofu-warp-f
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86525
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18095:8888"
    volumes:
      - ofu-warp-f:/app/data

  tinyproxy-f:
    <<: *tinyproxy
    container_name: ofu-proxy-f
    network_mode: service:alztrk-warp-f
    depends_on:
      alztrk-warp-f:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=f
    volumes:
      - ofu-dedupe:/markers

  # Keeps egress addresses distinct across the pool. WARP draws from a
  # small per-region pool, so nodes collide by default; this one polls
  # every node, re-rolls the collisions, and drains nodes that cannot be
  # given their own address. Best effort: if it dies, the pool still runs.
  ofu-dedupe:
    build:
      context: ./dedupe
    image: ofu-dedupe:local
    pull_policy: never
    container_name: ofu-dedupe
    command:
      - "--interval=${DEDUPE_INTERVAL:-30}"
    environment:
      - POOL_NODES=alztrk-warp-a,alztrk-warp-b,alztrk-warp-c,alztrk-warp-d,alztrk-warp-e,alztrk-warp-f
    volumes:
      - ofu-dedupe:/markers
    restart: unless-stopped
    depends_on:
      alztrk-warp-a:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0 if 'dedupe' in open('/proc/1/cmdline').read() else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


volumes:
  ofu-dedupe:      # per-node drain markers, shared with the proxies
  ofu-warp-a:
  ofu-warp-b:
  ofu-warp-c:
  ofu-warp-d:
  ofu-warp-e:
  ofu-warp-f:
