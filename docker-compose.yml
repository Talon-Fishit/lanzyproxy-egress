# GENERATED BY stack/generate-compose.py - do not edit by hand.
# Each node = one WARP network namespace + one CONNECT proxy on its own port.

x-warp: &warp
  build:
    context: ./warp
    dockerfile: Dockerfile
  image: ofu-warp-rotator:local
  pull_policy: never
  privileged: true
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 90s

x-tinyproxy: &tinyproxy
  build:
    context: ./tinyproxy
  image: ofu-tinyproxy:local
  pull_policy: never
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "http_proxy=http://127.0.0.1:8888 wget -q -O /dev/null -T 3 http://cp.cloudflare.com/generate_204 || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 15s

services:
  # Seeds the engine's config into its named volume (bind-mounting that
  # path breaks startup, so it is copied instead).

  alztrk-warp-a:
    <<: *warp
    container_name: ofu-warp-a
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86400
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18090:8888"
    volumes:
      - ofu-warp-a:/app/data

  tinyproxy-a:
    <<: *tinyproxy
    container_name: ofu-proxy-a
    network_mode: service:alztrk-warp-a
    depends_on:
      alztrk-warp-a:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=a
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-b:
    <<: *warp
    container_name: ofu-warp-b
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86425
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18091:8888"
    volumes:
      - ofu-warp-b:/app/data

  tinyproxy-b:
    <<: *tinyproxy
    container_name: ofu-proxy-b
    network_mode: service:alztrk-warp-b
    depends_on:
      alztrk-warp-b:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=b
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-c:
    <<: *warp
    container_name: ofu-warp-c
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86450
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18092:8888"
    volumes:
      - ofu-warp-c:/app/data

  tinyproxy-c:
    <<: *tinyproxy
    container_name: ofu-proxy-c
    network_mode: service:alztrk-warp-c
    depends_on:
      alztrk-warp-c:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=c
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-d:
    <<: *warp
    container_name: ofu-warp-d
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86475
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18093:8888"
    volumes:
      - ofu-warp-d:/app/data

  tinyproxy-d:
    <<: *tinyproxy
    container_name: ofu-proxy-d
    network_mode: service:alztrk-warp-d
    depends_on:
      alztrk-warp-d:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=d
    volumes:
      - ofu-dedupe:/markers

  alztrk-warp-e:
    <<: *warp
    container_name: ofu-warp-e
    environment:
      - CORS_ALLOW_ORIGINS=*
      - WARP_ROTATION_INTERVAL=86500
      - WARP_ACCEPT_TOS=${WARP_ACCEPT_TOS:-0}
    ports:
      - "18094:8888"
    volumes:
      - ofu-warp-e:/app/data

  tinyproxy-e:
    <<: *tinyproxy
    container_name: ofu-proxy-e
    network_mode: service:alztrk-warp-e
    depends_on:
      alztrk-warp-e:
        condition: service_healthy
    environment:
      # Names this node's drain marker, /markers/<NODE_ID>.
      - NODE_ID=e
    volumes:
